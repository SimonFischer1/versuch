<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05090c">
<title>Steering Simulator · NavTool</title><link rel="icon" href="/pic/allgemein/icon-192.png"><link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="/assets/navtool-global.css"></head><body>

<header id="top">
  <a class="lg" href="/" aria-label="NavTool Start"><img src="/pic/allgemein/logo.png" alt="NavTool"></a>

  <div id="mode" role="group" aria-label="Modus">
    <i id="thumb"></i>
    <button id="mFree" class="on" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>Freie Fahrt</span></button>
    <button id="mPrac" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg><span>Üben</span></button>
  </div>

  <div id="cbox">
    <div class="ch"><span id="clab">Modus</span><span id="csec"></span></div>
    <div id="cmd">Freie Fahrt</div>
    <div id="cbar"><i></i></div>
  </div>

  <div id="stat" hidden><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/></svg><b id="sc">0</b></div>
</header>

<div id="opts" hidden>
  <div class="grp"><span>Fokus</span>
    <div class="seg" id="focus">
      <button data-v="steer" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M12 4v6M5 16l5.2-3M19 16l-5.2-3"/></svg>Steuern</button>
      <button data-v="tele" type="button"><svg viewBox="0 0 24 24"><path d="M12 3v18"/><rect x="8" y="9" width="8" height="5" rx="1.6"/><path d="M5 5h3M5 19h3M16 5h3M16 19h3"/></svg>Telegraf</button>
      <button data-v="both" class="on" type="button"><svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="5"/><path d="M18 4v16"/><rect x="15.5" y="9" width="5" height="4" rx="1.2"/></svg>Beides</button>
    </div>
  </div>
  <div class="grp"><span>Genauigkeit</span>
    <div class="seg" id="lvl">
      <button data-v="3" type="button"><em><u></u><u class="o"></u><u class="o"></u></em>Anfänger ±3°</button>
      <button data-v="1" class="on" type="button"><em><u></u><u></u><u class="o"></u></em>Standard ±1°</button>
      <button data-v="0.5" type="button"><em><u></u><u></u><u></u></em>Experte ±0,5°</button>
    </div>
  </div>
</div>

<main>
  <section id="L"><canvas id="gy" width="600" height="600"></canvas>
    <div class="row"><div><small>Rate of Turn</small><b id="rot">0.0</b><small>°/min</small></div><div><small>Fahrt</small><b id="spd">0.0</b><small>kn</small></div></div></section>

  <section id="C"><canvas id="rd" width="440" height="120"></canvas>
    <svg id="wh" viewBox="-200 -200 400 400">
      <defs>
        <radialGradient id="hubg" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#16222a"/><stop offset="1" stop-color="#0a1014"/></radialGradient>
        <linearGradient id="rimg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a444c"/><stop offset="1" stop-color="#0c1115"/></linearGradient>
      </defs>
      <circle r="100" fill="url(#hubg)" stroke="#33414a" stroke-width="3"/>
      <g id="tk"></g>
      <circle r="47" fill="none" stroke="rgba(85,229,209,.10)" stroke-width="1"/>
      <g id="wg">
        <path d="M-130-80A153 153 0 1 0 130-80" fill="none" stroke="#06090b" stroke-width="46" stroke-linecap="round"/>
        <path d="M-130-80A153 153 0 1 0 130-80" fill="none" stroke="url(#rimg)" stroke-width="40" stroke-linecap="round" opacity=".9"/>
        <path d="M-130-80A153 153 0 1 0 130-80" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="2.5" transform="translate(0 -12)"/>
        <rect x="-28" y="94" width="56" height="44" rx="10" fill="#06090b" stroke="#2b353d"/>
        <path d="M-10-112h20l-10 24z" fill="#e8453c"/>
      </g>
      <!-- Branding in der Mitte des Handrads: dezent, dreht nicht mit -->
      <g id="brandHub" pointer-events="none">
        <image href="/pic/allgemein/logo.png" x="-40" y="-13" width="80" height="14.6" opacity=".34" preserveAspectRatio="xMidYMid meet"/>
        <text x="0" y="14" text-anchor="middle" font-size="6.5" letter-spacing="2.4" fill="#55e5d1" opacity=".28" font-family="system-ui,sans-serif" font-weight="700">STEERING GEAR</text>
      </g>
    </svg>
    <button id="mid" type="button">Mittschiffs</button></section>

  <section id="R">
    <div class="rh"><small>Maschinentelegraf</small></div>
    <div id="tplate"><span id="tpn">Halbe Fahrt voraus</span></div>
    <div id="tbox">
      <div id="tin">
        <span class="cap up">▲ VORAUS</span>
        <span class="cap dn">▼ ACHTERAUS</span>
        <div class="rail"><i id="rfill"></i></div>
        <div id="tn"></div>
        <div id="tlev" class="snap"><div class="knob"><b></b></div></div>
      </div>
    </div>
    <div class="tbrand"><img src="/pic/allgemein/logo.png" alt="NavTool"></div>
  </section>
</main>

<div id="warn"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.6"/><path d="M10.5 18.5h3"/></svg><b>Bitte das Gerät quer drehen</b><small>Der Simulator läuft im Querformat.</small></div>
<script src="/assets/navtool-global.js"></script><script src="app.js"></script><script src="modes.js"></script></body></html>
