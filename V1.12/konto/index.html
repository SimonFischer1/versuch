<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03090b">
<link rel="icon" type="image/png" href="/pic/allgemein/icon-192.png"><link rel="stylesheet" href="/assets/navtool-global.css"><link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/pic/allgemein/icon-180.png">
<title>Konto · NavTool</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#03090b;--p:#0a151b;--line:rgba(85,229,209,.18);--t:#55e5d1;--ink:#ecfbf9;--mute:#8ba7a8;--bad:#ff7b7b;--warn:#ffb454}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(60rem 30rem at 70% -5%,rgba(85,229,209,.13),transparent),var(--bg);color:var(--ink);font:400 16px/1.5 Inter,-apple-system,"Segoe UI",system-ui,sans-serif}
main{width:min(1000px,100% - 28px);margin:0 auto;padding:40px 0 80px}
.eb{font:800 11px ui-monospace,Menlo,monospace;letter-spacing:.22em;color:var(--t)}
h1{margin:6px 0 8px;font-size:clamp(34px,6vw,54px);line-height:1;letter-spacing:-.03em}h2{margin:0 0 12px;font-size:22px}h3{margin:0 0 6px;font-size:18px}
.sub,small,.n{color:var(--mute);font-size:14px}.n{margin:6px 0}small{display:block}
.ac{width:min(460px,100%);margin:0 auto}
.tabs{display:flex;gap:6px;margin:18px 0 14px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--p)}.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:transparent;color:var(--mute);font:800 14px inherit;cursor:pointer}.tabs .on{background:var(--t);color:#03211d}
label{display:block;margin:12px 0 0;font:800 11px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
input,select{width:100%;margin-top:5px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#071116;color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--t);outline-offset:2px}
.cta{display:inline-flex;justify-content:center;align-items:center;margin-top:16px;padding:14px 22px;width:100%;border:0;border-radius:14px;background:var(--t);color:#03211d;font:800 16px inherit;cursor:pointer;box-shadow:0 10px 40px rgba(85,229,209,.25)}
.btn{padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:800 13px inherit;cursor:pointer}.btn:hover{border-color:var(--t)}
.msg{min-height:22px;margin:12px 0 0;color:var(--warn)}.msg.ok{color:var(--t)}
a{color:var(--t)}
.grid{display:grid;gap:14px;margin-top:18px}@media(min-width:860px){.grid{grid-template-columns:1fr 1fr}.grid .wide{grid-column:1/-1}}
.box{padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--p);position:relative}
.box::before{content:"";position:absolute;top:-1px;left:-1px;width:18px;height:18px;border-top:2px solid var(--t);border-left:2px solid var(--t);border-radius:18px 0 0 0}
.hello{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}.row>input,.row>select{flex:1 1 140px;margin:0}
.chip{display:inline-block;padding:3px 10px;border:1px solid var(--line);border-radius:99px;font-size:12px;font-weight:800}.chip.ok{border-color:var(--t);color:var(--t)}.chip.wait{border-color:var(--warn);color:var(--warn)}
.mem{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}.mem>span:first-child{flex:1 1 180px}.mem select{width:auto;margin:0;padding:6px}
.item{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.item pre{margin:6px 0 0;white-space:pre-wrap;font:12px ui-monospace,Menlo,monospace;color:#b9cfcf}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
@media(prefers-reduced-motion:no-preference){.box{animation:up .5s both}@keyframes up{from{opacity:0;transform:translateY(12px)}}}
</style>
</head>
<body>
<main id="v"><p class="sub">Lade …</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/supabase-config.js"></script>
<script src="/assets/navtool-global.js"></script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cfg=window.NT_SB,Q=new URLSearchParams(location.search),ROLES=['Admin','Kapitän','Crew','Betrachter'];
let c,U=null,booted=false;
const dt=s=>s?new Date(s).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}):'–';
const ERR={'Invalid login credentials':'E-Mail oder Passwort stimmt nicht.','Email not confirmed':'Bitte bestätige zuerst deine E-Mail (Link im Postfach).','User already registered':'Diese E-Mail ist schon registriert. Bitte melde dich an.'};
const err=e=>ERR[e.message]||(/rate limit/i.test(e.message)?'Zu viele E-Mails in kurzer Zeit. Bitte warte einige Minuten.':e.message);
const next=()=>{const n=Q.get('next');return n&&n[0]=='/'&&n[1]!='/'?n:null};
function setupMissing(){$('#v').innerHTML='<div class="ac"><div class="eb">NAVTOOL / KONTO</div><h1>Fast fertig</h1><p class="sub">Die Verbindung zu Supabase ist noch nicht eingerichtet. Trage in <b>assets/supabase-config.js</b> den anon/publishable-Key ein (Supabase → Project Settings → API) und lade die Datei neu hoch.</p></div>'}
function authView(m){m=m||Q.get('m')||'login';const em=Q.get('email')||'';
$('#v').innerHTML=`<div class="ac"><div class="eb">NAVTOOL / KONTO</div><h1>${m=='register'?'Registrieren':m=='reset'?'Passwort vergessen':'Anmelden'}</h1><p class="sub">Ein Konto für alle NavTool-Apps: Website, NavTool-App und SailingApp.</p>
<div class="tabs"><button class="${m!='register'?'on':''}" onclick="authView('login')">Anmelden</button><button class="${m=='register'?'on':''}" onclick="authView('register')">Registrieren</button></div>
<form id="f" novalidate>${m=='register'?'<label>Dein Name<input id="n" autocomplete="name" required></label>':''}<label>E-Mail<input id="e" type="email" autocomplete="email" required value="${E(em)}"></label>${m!='reset'?`<label>Passwort${m=='register'?' (mindestens 8 Zeichen)':''}<input id="p" type="password" autocomplete="${m=='register'?'new-password':'current-password'}" required></label>`:''}<button class="cta" id="go">${m=='register'?'Konto erstellen':m=='reset'?'Link senden':'Anmelden'}</button><p id="msg" class="msg" role="status"></p></form>${m=='login'?'<a href="#" onclick="authView(\'reset\');return false">Passwort vergessen?</a>':m=='reset'?'<a href="#" onclick="authView(\'login\');return false">Zurück zur Anmeldung</a>':''}</div>`;
$('#f').onsubmit=async ev=>{ev.preventDefault();const msg=$('#msg'),b=$('#go'),e=$('#e').value.trim(),p=$('#p')&&$('#p').value;msg.className='msg';msg.textContent='';
if(!e)return msg.textContent='Bitte E-Mail eingeben.';if(m!='reset'&&!p)return msg.textContent='Bitte Passwort eingeben.';
if(m=='register'){const n=$('#n').value.trim();if(!n)return msg.textContent='Bitte deinen Namen eingeben.';if(p.length<8)return msg.textContent='Das Passwort braucht mindestens 8 Zeichen.'}
b.disabled=true;try{
 if(m=='login'){const{error}=await c.auth.signInWithPassword({email:e,password:p});if(error)throw error}
 else if(m=='register'){const{data,error}=await c.auth.signUp({email:e,password:p,options:{data:{name:$('#n').value.trim()},emailRedirectTo:location.origin+'/konto/'+(next()?'?next='+encodeURIComponent(next()):'')}});if(error)throw error;if(!data.session){msg.className='msg ok';msg.textContent='Fast geschafft: Wir haben dir eine E-Mail geschickt. Bestätige sie, danach kannst du dich anmelden.'}}
 else{const{error}=await c.auth.resetPasswordForEmail(e,{redirectTo:location.origin+'/konto/'});if(error)throw error;msg.className='msg ok';msg.textContent='Wenn die E-Mail registriert ist, kommt gleich ein Link zum Zurücksetzen.'}
}catch(x){msg.textContent=err(x)}b.disabled=false}}
function recoverView(){$('#v').innerHTML=`<div class="ac"><div class="eb">NAVTOOL / KONTO</div><h1>Neues Passwort</h1><form id="f"><label>Neues Passwort (mindestens 8 Zeichen)<input id="p" type="password" autocomplete="new-password" required></label><button class="cta">Speichern</button><p id="msg" class="msg"></p></form></div>`;
$('#f').onsubmit=async ev=>{ev.preventDefault();const p=$('#p').value;if(p.length<8)return $('#msg').textContent='Mindestens 8 Zeichen.';const{error}=await c.auth.updateUser({password:p});if(error)return $('#msg').textContent=err(error);history.replaceState(null,'',location.pathname);dash()}}
const FAVS=[['Map','/map/'],['Navtext','/navtext/'],['Colreg','/colreg/'],['Weather','/weather/'],['Calc','/calc/'],['Simulator','/simulator/'],['SailingApp','/sailingapp/']];
async function dash(){const nx=next();if(nx){location.href=nx;return}
$('#v').innerHTML='<p class="sub">Lade dein Dashboard …</p>';
await c.rpc('claim_invites');
const[r,mm,fv,ka]=await Promise.all([c.from('reisen').select('id,name,owner_id,updated_at').order('created_at'),c.from('reise_mitglieder').select('*').order('eingeladen_am'),c.from('favoriten').select('*').order('created_at',{ascending:false}),c.from('kalkulationen').select('*').order('created_at',{ascending:false})]);
const bad=[r,mm,fv,ka].find(x=>x.error);
if(bad)return $('#v').innerHTML=`<div class="ac"><h1>Datenbank</h1><p class="msg">${E(bad.error.message)}</p><p class="sub">Falls die Tabellen fehlen: Inhalt von supabase/schema.sql im Supabase SQL Editor ausführen.</p><button class="btn" onclick="c.auth.signOut()">Abmelden</button></div>`;
const name=(U.user_metadata&&U.user_metadata.name)||U.email.split('@')[0],trips=r.data||[],members=mm.data||[],favs=fv.data||[],calcs=ka.data||[],have=new Set(favs.map(x=>x.url));
const tripHtml=t=>{const own=t.owner_id==U.id,rows=members.filter(x=>x.reise_id==t.id);return`<div class="item" style="display:block"><h3>${E(t.name)}</h3><small>${own?'Du bist Admin':'Du bist Mitglied'} · zuletzt ${dt(t.updated_at)}</small>${rows.map(x=>`<div class="mem"><span>${E(x.name||x.email)}<small>${E(x.email)}</small></span><span class="chip ${x.user_id?'ok':'wait'}">${x.user_id?'angemeldet':'ausstehend'}</span>${own&&x.user_id!=U.id?`<select aria-label="Rolle" onchange="setRolle('${x.id}',this.value)">${ROLES.map(o=>`<option ${o==x.rolle?'selected':''}>${o}</option>`).join('')}</select><button class="btn" aria-label="Entfernen" onclick="delMem('${x.id}')">✕</button>`:`<span class="chip">${E(x.rolle)}</span>`}</div>`).join('')}${own?`<form class="row" onsubmit="return addMem(event,'${t.id}')"><input name="e" type="email" placeholder="E-Mail des Mitglieds" required><input name="n" placeholder="Name"><select name="r">${ROLES.filter(o=>o!='Admin').map(o=>`<option>${o}</option>`).join('')}</select><button class="btn">＋ Einladen</button></form>`:''}</div>`};
$('#v').innerHTML=`<div class="hello"><div><div class="eb">NAVTOOL / DASHBOARD</div><h1>Willkommen, ${E(name)}</h1><p class="sub">${E(U.email)}</p></div><div class="row"><a class="btn" href="/sailingapp/">SailingApp öffnen</a><button class="btn" onclick="exportAll()">Meine Daten exportieren</button><button class="btn" onclick="c.auth.signOut()">Abmelden</button></div></div>
<div class="grid">
<div class="box wide"><h2>Reisen (SailingApp)</h2>${trips.length?trips.map(tripHtml).join(''):'<p class="n">Noch keine Reise. Lege hier eine an oder eröffne sie in der SailingApp.</p>'}<form class="row" onsubmit="return newTrip(event)"><input name="n" placeholder="Name der neuen Reise" required><button class="btn">＋ Reise anlegen</button></form><p class="n">Ein Mitglied bekommt Zugriff, sobald es sich mit der eingeladenen E-Mail registriert und angemeldet hat. Bis dahin steht es auf „ausstehend“.</p></div>
<div class="box"><h2>Favoriten</h2>${favs.length?favs.map(x=>`<div class="item"><span><a href="${E(x.url)}">${E(x.titel)}</a><small>${E(x.app)} · ${dt(x.created_at)}</small></span><button class="btn" aria-label="Entfernen" onclick="del('favoriten','${x.id}')">✕</button></div>`).join(''):'<p class="n">Noch keine Favoriten. Im Kopf jeder NavTool-Seite findest du unter deinem Namen „★ Diese Seite merken“.</p>'}<div class="chips">${FAVS.filter(f=>!have.has(f[1])).map(f=>`<button class="btn" onclick="addFav('${f[0]}','${f[1]}')">★ ${f[0]}</button>`).join('')}</div></div>
<div class="box"><h2>Gespeicherte Kalkulationen</h2>${calcs.length?calcs.map(x=>`<div class="item"><span><b>${E(x.titel)}</b><small>${E(x.app)} · ${dt(x.created_at)}</small><pre>${E(Object.entries(x.daten||{}).map(([k,v])=>k+': '+(typeof v=='object'?JSON.stringify(v):v)).join('\n'))}</pre></span><button class="btn" aria-label="Entfernen" onclick="del('kalkulationen','${x.id}')">✕</button></div>`).join(''):'<p class="n">Noch keine Kalkulationen. Rechner und Apps können Ergebnisse hier ablegen, damit sie auf jedem Gerät verfügbar sind.</p>'}</div>
<div class="box wide"><h2>Mein Profil</h2><form class="row" onsubmit="return saveName(event)"><input name="n" value="${E(name)}" required aria-label="Anzeigename"><button class="btn">Namen speichern</button></form></div>
</div>`;
window._d={trips,members,favs,calcs}}
async function run(p){const{error}=await p;if(error){alert(error.message);return false}dash();return true}
function del(t,id){if(confirm('Wirklich löschen?'))run(c.from(t).delete().eq('id',id))}
function addFav(t,u){run(c.from('favoriten').insert({app:'navtool',titel:t,url:u}))}
function saveName(e){e.preventDefault();const n=e.target.n.value.trim();Promise.all([c.auth.updateUser({data:{name:n}}),c.from('profiles').update({name:n}).eq('id',U.id)]).then(()=>{U.user_metadata=Object.assign({},U.user_metadata,{name:n});dash()});return false}
async function newTrip(e){e.preventDefault();const n=e.target.n.value.trim(),{data,error}=await c.from('reisen').insert({name:n,owner_id:U.id}).select('id').single();if(error)return alert(error.message),false;await c.from('reise_mitglieder').insert({reise_id:data.id,email:U.email,name:(U.user_metadata&&U.user_metadata.name)||'',rolle:'Admin',user_id:U.id});dash();return false}
async function addMem(e,id){e.preventDefault();const f=e.target,em=f.e.value.trim().toLowerCase(),n=f.n.value.trim(),ro=f.r.value,{error}=await c.from('reise_mitglieder').insert({reise_id:id,email:em,name:n,rolle:ro});if(error)return alert(error.code=='23505'?'Diese E-Mail ist schon Mitglied.':error.message),false;
const t=_d.trips.find(x=>x.id==id),txt=`Hallo ${n||''}, du bist zur Reise „${t.name}“ in der NavTool SailingApp eingeladen (Rolle: ${ro}). Registriere dich mit dieser E-Mail: ${location.origin}/konto/?m=register&email=${encodeURIComponent(em)}`;
try{await navigator.clipboard.writeText(txt);alert('Einladung gespeichert. Der Einladungstext liegt in der Zwischenablage, schick ihn der Person.')}catch(x){prompt('Einladungstext kopieren und senden:',txt)}dash();return false}
function setRolle(id,r){run(c.from('reise_mitglieder').update({rolle:r}).eq('id',id))}
function delMem(id){if(confirm('Mitglied entfernen?'))run(c.from('reise_mitglieder').delete().eq('id',id))}
function exportAll(){const d=Object.assign({konto:{email:U.email,name:U.user_metadata&&U.user_metadata.name}},_d),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,1)],{type:'application/json'}));a.download='navtool-konto.json';a.click()}
if(!window.supabase||!cfg||!cfg.key||/^DEIN/.test(cfg.key))setupMissing();
else{c=supabase.createClient(cfg.url,cfg.key);
 c.auth.onAuthStateChange((ev,s)=>{U=s&&s.user||null;setTimeout(()=>{if(ev=='PASSWORD_RECOVERY')recoverView();else if(U)dash();else authView()},0)})}
</script>
</body>
</html>
