<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NavTool · Rechenblatt</title>
  <meta name="theme-color" content="#05090c">
  <link rel="icon" type="image/png" href="/pic/allgemein/icon-192.png">
  <link rel="stylesheet" href="/assets/navtool-global.css">
  <style>
    :root {
      --nt-bg: #05090c;
      --nt-panel: rgba(10,21,27,.82);
      --nt-panel-strong: rgba(12,27,34,.96);
      --nt-text: #ecfbf9;
      --nt-muted: #7e9697;
      --nt-teal: #55e5d1;
      --nt-line: rgba(85,229,209,.14);
      --nt-line-strong: rgba(85,229,209,.32);
      --nt-warn: #ffb454;
      --nt-bad: #ff7070;
      --nt-ok: #3fdc7e;
      --nt-shadow: rgba(0,0,0,.18);
    }

    * { box-sizing: border-box; }
    html { background: var(--nt-bg); }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 8%, rgba(85,229,209,.06), transparent 22%),
        radial-gradient(circle at 82% 18%, rgba(103,223,255,.05), transparent 20%),
        var(--nt-bg);
      color: var(--nt-text);
      font: 400 16px/1.6 Inter, system-ui, sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(85,229,209,.02) 1px, transparent 1px), linear-gradient(90deg, rgba(85,229,209,.018) 1px, transparent 1px);
      background-size: 42px 42px;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--nt-line);
      border-radius: 12px;
      background: rgba(10,21,27,.9);
      color: var(--nt-text);
    }
    input:focus, select:focus { outline: none; border-color: var(--nt-teal); box-shadow: 0 0 0 3px rgba(85,229,209,.08); }

    .calc-shell {
      width: min(1240px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }
    .calc-topbar {
      width: min(1240px, calc(100% - 28px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 74px;
    }
    .status-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 10px; border: 1px solid var(--nt-line-strong); border-radius: 999px;
      background: rgba(10,21,27,.8); font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--nt-muted);
    }
    .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--nt-ok); box-shadow: 0 0 12px var(--nt-ok); }

    .calc-layout {
      display: grid;
      grid-template-columns: 290px minmax(0,1fr);
      gap: 36px;
      margin-top: 18px;
    }
    .sidebar {
      padding: 12px 0 0;
    }
    .calc-brand {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--nt-teal);
      margin-bottom: 6px;
    }
    .sidebar h2 {
      margin: 0;
      font-size: clamp(32px, 3.5vw, 56px);
      line-height: 1;
      letter-spacing: -0.06em;
    }
    .sidebar p {
      margin: 14px 0 18px;
      color: var(--nt-muted);
      font-size: 14px;
      line-height: 1.7;
    }
    .tool-search {
      width: 100%;
      margin-bottom: 18px;
    }
    .tool-list {
      display: grid;
      gap: 8px;
    }
    .tool-item {
      width: 100%;
      border: 1px solid transparent;
      border-left: 3px solid transparent;
      background: transparent;
      color: var(--nt-text);
      text-align: left;
      border-radius: 10px;
      padding: 12px 12px 10px;
      cursor: pointer;
      transition: 0.2s ease;
    }
    .tool-item:hover { background: rgba(85,229,209,.04); }
    .tool-item.active {
      background: rgba(85,229,209,.08);
      border-color: var(--nt-teal);
      border-left-color: var(--nt-teal);
    }
    .tool-item strong { display: block; font-size: 15px; font-weight: 800; }
    .tool-item small { display: block; color: var(--nt-muted); margin-top: 4px; font-size: 12px; }

    .main-panel {
      min-width: 0;
    }
    .top-card {
      border: 1px solid var(--nt-line-strong);
      border-radius: 18px;
      padding: 20px 18px;
      background: linear-gradient(180deg, rgba(13,27,34,.96), rgba(10,21,27,.82));
      box-shadow: 0 18px 40px rgba(0,0,0,.12);
      position: relative;
      overflow: hidden;
    }
    .top-card::before {
      content: "";
      position: absolute;
      right: -30px;
      top: -26px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(85,229,209,.18), transparent 70%);
    }
    .top-card .eyebrow {
      color: var(--nt-teal);
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-weight: 900;
    }
    .top-card h1 {
      margin: 12px 0 0;
      font-size: clamp(34px, 4vw, 56px);
      letter-spacing: -0.06em;
      line-height: 1;
    }
    .top-card p {
      margin: 8px 0 0;
      color: var(--nt-muted);
      font-size: 14px;
    }
    .card-grid {
      margin-top: 18px;
      border: 1px solid var(--nt-line);
      border-radius: 18px;
      background: rgba(10,21,27,.82);
      padding: 18px;
    }
    .calc-form {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 16px 18px;
    }
    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #c4dad7;
      font-weight: 700;
    }
    .result-box {
      margin-top: 18px;
      min-height: 70px;
      border: 1px solid var(--nt-line);
      border-radius: 14px;
      background: rgba(5,9,12,.8);
      padding: 16px 18px;
      color: var(--nt-muted);
    }
    .result-box strong {
      color: var(--nt-text);
      font-size: 27px;
      letter-spacing: -0.04em;
      font-weight: 900;
    }
    .result-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .row-result {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 1px dashed rgba(85,229,209,.12);
      padding-bottom: 8px;
      color: var(--nt-muted);
    }
    .row-result:last-child { border-bottom: 0; padding-bottom: 0; }
    .row-result b {
      color: var(--nt-teal);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }
    .button-row {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .button-row button {
      border: 0;
      border-radius: 12px;
      background: var(--nt-teal);
      color: #03211d;
      min-height: 46px;
      padding: 0 18px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .button-row .secondary {
      background: transparent;
      color: var(--nt-text);
      border: 1px solid var(--nt-line);
    }

    @media (max-width: 980px) {
      .calc-layout { grid-template-columns: 1fr; }
      .calc-form { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 620px) {
      .calc-form { grid-template-columns: 1fr; }
      .calc-topbar { min-height: 68px; }
      .nt-nav { display: none; }
    }
    select{appearance:none;-webkit-appearance:none;cursor:pointer}
    .field.wide{grid-column:1/-1}
    .grp{display:flex;flex-wrap:wrap;gap:8px}
    .grp>*{flex:1 1 70px;min-width:0}
    .grp select{flex:0 0 84px}
    .grp .gl{display:block;font-size:10px;letter-spacing:.1em;color:var(--nt-muted);margin:0 0 4px 2px;text-transform:uppercase}
    .calc-err{color:var(--nt-bad);font-weight:700}
    .steps{margin-top:14px;padding-top:12px;border-top:1px solid var(--nt-line);font-size:13px}
    .steps h4{margin:0 0 6px;color:var(--nt-teal);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
    .steps .row-result b{font-size:14px}
    .pm{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.72);display:none;overflow:auto;padding:20px}
    .pm.open{display:block}
    .pm-bar{max-width:800px;margin:0 auto 12px;display:flex;gap:10px;justify-content:flex-end}
    .pm-bar button{border:0;border-radius:10px;min-height:42px;padding:0 16px;font-weight:800;cursor:pointer;background:var(--nt-teal);color:#03211d}
    .pm-bar .secondary{background:transparent;color:#fff;border:1px solid var(--nt-line-strong)}
    .pm-sheet{max-width:800px;margin:0 auto;background:#fff;color:#111;padding:34px 38px;border-radius:6px;font:14px/1.5 Inter,system-ui,sans-serif}
    .pm-sheet h1{margin:0 0 2px;font-size:24px}
    .pm-sheet h2{margin:20px 0 6px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#0a7d70;border-bottom:1px solid #ccc;padding-bottom:4px}
    .pm-sheet table{width:100%;border-collapse:collapse}
    .pm-sheet td{padding:5px 0;border-bottom:1px dashed #ddd;vertical-align:top}
    .pm-sheet td:last-child{text-align:right;font-weight:700}
    .pm-sheet .disc{margin-top:26px;padding:10px 12px;border:1px solid #999;font-size:12px}
    .pm-sheet .meta{color:#666;font-size:12px}
    @media print{
      body>*:not(#printModal){display:none!important}
      body::before{display:none}
      html,body{background:#fff!important}
      .pm{position:static;background:#fff;padding:0;display:block}
      .pm-bar{display:none}
      .pm-sheet{padding:0;border-radius:0}
    }
  </style>
</head>
<body>
  <!-- Kopfleiste kommt aus /assets/navtool-global.js -->

  <main class="calc-shell">
    <div class="calc-layout">
      <aside class="sidebar">
        <div class="calc-brand">NavTool</div>
        <h2>Rechenblatt</h2>
        <p>Navigation, Kompass und Schiffstheorie.</p>

        <input class="tool-search" id="toolSearch" type="search" placeholder="Rechner suchen" aria-label="Rechner suchen">

        <div class="tool-list" id="toolList"></div>
      </aside>

      <section class="main-panel">
        <div class="top-card">
          <div class="eyebrow" id="toolEyebrow">Navigation</div>
          <h1 id="toolTitle">Besteckrechnung</h1>
          <p id="toolDesc">Mittlere Distanz, rwk</p>
        </div>

        <div class="card-grid">
          <div id="form"></div>
          <div class="button-row">
            <button type="button" class="secondary" id="resetBtn">Zurücksetzen</button>
            <button type="button" id="calcBtn">Berechnen</button>
            <button type="button" class="secondary" id="pdfBtn">Als PDF / Drucken</button>
          </div>
          <div class="result-box" id="resultBox">Ergebnis erscheint hier.</div>
        </div>
      </section>
    </div>
  </main>

  <div class="pm" id="printModal"><div class="pm-bar"><button type="button" class="secondary" id="pmClose">Schließen</button><button type="button" id="pmPrint">Drucken / PDF speichern</button></div><div class="pm-sheet" id="pmSheet"></div></div>

  <footer class="nt-foot" role="contentinfo">
    <div class="nt-foot-in">
      <div>
        <div class="nt-foot-brand"><img src="/pic/allgemein/logo.png" alt="NavTool"></div>
        <div class="nt-foot-copy">Maritime Navigation Workspace · navtool.de · Navigation, Wetter, Regeln und Berechnung</div>
      </div>
      <div class="nt-foot-links">
        <a href="/">Home</a>
        <a href="/status/">Status</a>
      </div>
    </div>
    <div class="nt-foot-bar">
      <span>NavTool</span>
      <span><a href="/status/">Status</a> · <a href="/me/">Ersteller</a></span>
    </div>
  </footer>

  <script>
    const calculators = {
      'besteck': {
        label: 'Besteckrechnung',
        group: 'Navigation',
        description: 'Mittlere Distanz, rwk',
        fields: [
          {name: 'latA', label: 'Breite A – Grad', type: 'number', value: 0},
          {name: 'latAm', label: 'Breite A – Minuten', type: 'number', value: 0},
          {name: 'lonA', label: 'Länge A – Grad', type: 'number', value: 0},
          {name: 'lonAm', label: 'Länge A – Minuten', type: 'number', value: 0},
          {name: 'latB', label: 'Breite B – Grad', type: 'number', value: 0},
          {name: 'latBm', label: 'Breite B – Minuten', type: 'number', value: 0},
          {name: 'lonB', label: 'Länge B – Grad', type: 'number', value: 0},
          {name: 'lonBm', label: 'Länge B – Minuten', type: 'number', value: 0}
        ],
        calc: (values) => {
          const latA = Number(values.latA) + Number(values.latAm || 0)/60;
          const lonA = Number(values.lonA) + Number(values.lonAm || 0)/60;
          const latB = Number(values.latB) + Number(values.latBm || 0)/60;
          const lonB = Number(values.lonB) + Number(values.lonBm || 0)/60;
          const dLat = (latB - latA) * 60;
          const dLon = (lonB - lonA) * 60;
          const dist = Math.sqrt(dLat*dLat + dLon*dLon).toFixed(2);
          const dir = (((Math.atan2(dLon, dLat) * 180 / Math.PI) + 360) % 360).toFixed(1);
          return { items: [
            { label: 'Distanz', value: dist + ' sm' },
            { label: 'Richtung', value: dir + '°' }
          ] };
        }
      },
      'großkreis': {
        label: 'Großkreisnavigation',
        group: 'Navigation',
        description: 'Distanz & Anfangskurs',
        fields: [
          {name: 'lat1', label: 'Breite 1 – Grad', type: 'number', value: 0},
          {name: 'lat1m', label: 'Breite 1 – Minuten', type: 'number', value: 0},
          {name: 'lon1', label: 'Länge 1 – Grad', type: 'number', value: 0},
          {name: 'lon1m', label: 'Länge 1 – Minuten', type: 'number', value: 0},
          {name: 'lat2', label: 'Breite 2 – Grad', type: 'number', value: 0},
          {name: 'lat2m', label: 'Breite 2 – Minuten', type: 'number', value: 0},
          {name: 'lon2', label: 'Länge 2 – Grad', type: 'number', value: 0},
          {name: 'lon2m', label: 'Länge 2 – Minuten', type: 'number', value: 0}
        ],
        calc: (values) => {
          const p1 = { lat: Number(values.lat1) + Number(values.lat1m || 0)/60, lon: Number(values.lon1) + Number(values.lon1m || 0)/60 };
          const p2 = { lat: Number(values.lat2) + Number(values.lat2m || 0)/60, lon: Number(values.lon2) + Number(values.lon2m || 0)/60 };
          const lat1 = p1.lat*Math.PI/180, lat2 = p2.lat*Math.PI/180;
          const dLon = (p2.lon - p1.lon) * Math.PI / 180;
          const a = Math.acos(Math.sin(lat1)*Math.sin(lat2) + Math.cos(lat1)*Math.cos(lat2)*Math.cos(dLon));
          const dist = (3440.065 * a).toFixed(2);
          const dir = (((Math.atan2(Math.sin(dLon)*Math.cos(lat2), Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon)) * 180 / Math.PI) + 360) % 360).toFixed(1);
          return { items: [
            { label: 'Distanz', value: dist + ' sm' },
            { label: 'Anfangskurs', value: dir + '°' }
          ] };
        }
      },
      'strom': {
        label: 'Stromdreck',
        group: 'Navigation',
        description: 'KÜG & FÜG',
        fields: [
          {name: 'v', label: 'Geschwindigkeit – kn', type: 'number', value: 0},
          {name: 'crs', label: 'Kurs – °', type: 'number', value: 0},
          {name: 'set', label: 'Stromsetzung – °', type: 'number', value: 0},
          {name: 'drift', label: 'Stromdrift – kn', type: 'number', value: 0}
        ],
        calc: (values) => {
          const v = Number(values.v), c = Number(values.crs), s = Number(values.set), d = Number(values.drift);
          const x = v * Math.sin(c * Math.PI/180) + d * Math.sin(s * Math.PI/180);
          const y = v * Math.cos(c * Math.PI/180) + d * Math.cos(s * Math.PI/180);
          const speed = Math.hypot(x, y).toFixed(2);
          const course = (((Math.atan2(x, y) * 180 / Math.PI) + 360) % 360).toFixed(1);
          return { items: [
            { label: 'Ergebnis', value: speed + ' kn' },
            { label: 'Kurs über Grund', value: course + '°' }
          ] };
        }
      },
      'gyro': {
        label: 'Gyro Error (Sonnenazimut)',
        group: 'Kompass',
        description: 'Kreiselfehler aus Sonnenpeilung: TB, GE, TC, TE, D, MB',
        example: {day:9,mon:10,year:2026,uh:15,um:55,us:0,pd:37,pm:5,ps:30,pns:'N',ld:6,lm:51,ls:42,lew:'W',gb:243,mc:246.9,gc:246.8,vv:1.52,vew:'W'},
        fields: [
          {kind:'multi', label:'Datum (UTC)', parts:[{name:'day',ph:'Tag',min:1,max:31},{name:'mon',ph:'Monat',min:1,max:12},{name:'year',ph:'Jahr',min:1900,max:2100}]},
          {kind:'multi', label:'UTC-Zeit', parts:[{name:'uh',ph:'Std',min:0,max:23},{name:'um',ph:'Min',min:0,max:59},{name:'us',ph:'Sek',min:0,max:59.99,def:0}]},
          {kind:'multi', label:'Breite φ – Grad / Min / Sek', parts:[{name:'pd',ph:'Grad',min:0,max:90},{name:'pm',ph:'Min',min:0,max:59.99},{name:'ps',ph:'Sek',min:0,max:59.99,def:0}], sel:{name:'pns',opts:['N','S']}},
          {kind:'multi', label:'Länge λ – Grad / Min / Sek', parts:[{name:'ld',ph:'Grad',min:0,max:180},{name:'lm',ph:'Min',min:0,max:59.99},{name:'ls',ph:'Sek',min:0,max:59.99,def:0}], sel:{name:'lew',opts:['W','E']}},
          {kind:'multi', label:'Kreiselpeilung der Sonne – °', parts:[{name:'gb',ph:'0–360'}]},
          {kind:'multi', label:'Kurs magnetisch (Magnetkompass) – °', parts:[{name:'mc',ph:'0–360'}]},
          {kind:'multi', label:'Kreiselkurs – °', parts:[{name:'gc',ph:'0–360'}]},
          {kind:'multi', label:'Variation (Missweisung) – °', parts:[{name:'vv',ph:'Grad',min:0}], sel:{name:'vew',opts:['W','E']}}
        ],
        calc: (v) => {
          const n = k => v[k] === '' || v[k] === undefined ? NaN : Number(v[k]);
          const need = ['day','mon','year','uh','um','pd','pm','ld','lm','gb','mc','gc','vv'];
          if (need.some(k => isNaN(n(k)))) return {error: 'Bitte alle Felder ausfüllen (Sekunden dürfen leer bleiben).'};
          if (n('pd') > 90 || n('ld') > 180 || n('pm') >= 60 || n('lm') >= 60 || n('mon') < 1 || n('mon') > 12 || n('day') < 1 || n('day') > 31 || n('uh') > 23 || n('um') > 59)
            return {error: 'Ungültige Eingabe (Datum, Zeit oder Position prüfen).'};
          const s = k => isNaN(n(k)) ? 0 : n(k);
          const lat = (n('pd') + n('pm')/60 + s('ps')/3600) * (v.pns === 'S' ? -1 : 1);
          const lon = (n('ld') + n('lm')/60 + s('ls')/3600) * (v.lew === 'E' ? 1 : -1);
          const vr = n('vv') * (v.vew === 'E' ? 1 : -1);
          const sp = sunPosition(n('year'), n('mon'), n('day'), n('uh'), n('um'), s('us'));
          const R = Math.PI/180;
          const lha = ((sp.gha + lon) % 360 + 360) % 360;
          // Azimut von N im Uhrzeigersinn: A = atan2(-sin LHA, tan(Dec)·cos(φ) − sin(φ)·cos(LHA))
          const tb = (Math.atan2(-Math.sin(lha*R), Math.tan(sp.dec*R)*Math.cos(lat*R) - Math.sin(lat*R)*Math.cos(lha*R))/R + 360) % 360;
          const norm = x => ((x + 540) % 360) - 180;          // −180…+180, + = Ost
          const ge = norm(tb - n('gb'));                        // GE = TB − Kreiselpeilung
          const tc = ((n('gc') + ge) % 360 + 360) % 360;        // TC = Kreiselkurs + GE
          const te = norm(tc - n('mc'));                        // TE = TC − Kompasskurs
          const dv = te - vr;                                   // D = TE − Variation
          const mb = ((tb - te) % 360 + 360) % 360;             // MB = TB − TE
          const ew = x => Math.abs(x).toFixed(1) + '° ' + (x < 0 ? 'W' : 'E');
          const dm = x => { const a = ((x % 360) + 360) % 360; return Math.floor(a) + '° ' + ((a % 1) * 60).toFixed(1) + '\''; };
          const dmS = x => { const a = Math.abs(x), g = Math.floor(a); return g + '° ' + ((a - g) * 60).toFixed(1) + '\''; };
          return {
            items: [
              {label: 'True Bearing (TB)', value: tb.toFixed(1) + '°'},
              {label: 'Gyro Error (GE)', value: ew(ge)},
              {label: 'True Course (TC)', value: tc.toFixed(1) + '°'},
              {label: 'Total Error (TE)', value: ew(te)},
              {label: 'Deviation (D)', value: ew(dv)},
              {label: 'Magnetic Bearing (MB)', value: mb.toFixed(1) + '°'}
            ],
            steps: [
              {label: 'GHA Sonne', value: dm(sp.gha)},
              {label: 'Deklination Sonne', value: dmS(sp.dec) + (sp.dec < 0 ? ' S' : ' N')},
              {label: 'LHA = GHA ' + (lon < 0 ? '−' : '+') + ' λ', value: dm(lha)},
              {label: 'TB = atan2(−sin LHA ; tan Dek·cos φ − sin φ·cos LHA)', value: tb.toFixed(2) + '°'},
              {label: 'GE = TB − Kreiselpeilung', value: ew(ge)},
              {label: 'TC = Kreiselkurs + GE', value: tc.toFixed(1) + '°'},
              {label: 'TE = TC − Kurs magnetisch', value: ew(te)},
              {label: 'D = TE − Variation', value: ew(dv)},
              {label: 'MB = TB − TE', value: mb.toFixed(1) + '°'}
            ],
            note: 'Vorzeichen: E = +, W = −. Sonnenort nach Astronomical Almanac / Meeus (Genauigkeit ca. 0,01°). Die Peilung ändert sich um ca. 0,2° pro Minute – Zeit möglichst sekundengenau eingeben.'
          };
        }
      },
      'kompass': {
        label: 'Kompass',
        group: 'Kompass',
        description: 'Deviation, Missweisung, Gyro Error',
        fields: [
          {name: 'trueCourse', label: 'True Course – °', type: 'number', value: 0},
          {name: 'variation', label: 'Missweisung – °', type: 'number', value: 0},
          {name: 'deviation', label: 'Deviation – °', type: 'number', value: 0},
          {name: 'gyroError', label: 'Gyro Error – °', type: 'number', value: 0}
        ],
        calc: (values) => {
          const trueCourse = Number(values.trueCourse);
          const magnetic = trueCourse + Number(values.variation) + Number(values.deviation);
          const gyro = trueCourse + Number(values.gyroError);
          return { items: [
            { label: 'Magnetisch', value: magnetic.toFixed(1) + '°' },
            { label: 'Gyro', value: gyro.toFixed(1) + '°' }
          ] };
        }
      },
      'utc': {
        label: 'UTC-Rechner',
        group: 'Navigation',
        description: 'Ortszeit → UTC',
        fields: [
          {name: 'timezone', label: 'Zeitzone – h', type: 'number', value: 1},
          {name: 'time', label: 'Uhrzeit', type: 'time', value: '12:00'},
          {name: 'date', label: 'Datum', type: 'date', value: '2025-01-01'}
        ],
        calc: (values) => {
          const [h, m] = values.time.split(':').map(Number);
          const date = new Date(values.date + 'T00:00:00Z');
          date.setUTCHours((h || 0) - Number(values.timezone || 0), m || 0, 0, 0);
          return { items: [{label: 'UTC', value: date.toISOString().slice(11,16) + ' Uhr'}] };
        }
      },
      'sicht': {
        label: 'Feuer in der Kimm',
        group: 'Navigation',
        description: 'Sichtweite berechnen',
        fields: [
          {name: 'aug', label: 'Augeshöhe – m', type: 'number', value: 2},
          {name: 'licht', label: 'Leuchtturmhöhe – m', type: 'number', value: 35}
        ],
        calc: (values) => {
          const aug = Number(values.aug);
          const licht = Number(values.licht);
          const dist = (Math.sqrt(2*licht) + Math.sqrt(2*aug)).toFixed(2);
          return { items: [{ label: 'Sichtweite', value: dist + ' sm' }] };
        }
      },
      'radar': {
        label: 'Radarhorizont',
        group: 'Navigation',
        description: 'Reichweite nach Antennehöhe',
        fields: [
          {name: 'height', label: 'Antennehöhe – m', type: 'number', value: 15}
        ],
        calc: (values) => {
          const h = Number(values.height);
          const dist = (Math.sqrt(2 * h * 6371 / 1000) * 1.852).toFixed(2);
          return { items: [{ label: 'Radarhorizont', value: dist + ' sm' }] };
        }
      }
    };

    function sunPosition(y, m, d, h, mi, s) {
      if (m <= 2) { y -= 1; m += 12; }
      const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
      const jd = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5 + (h + mi / 60 + s / 3600) / 24;
      const T = (jd + 69 / 86400 - 2451545) / 36525, R = Math.PI / 180;
      const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
      const M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) * R;
      const C = (1.914602 - 0.004817 * T) * Math.sin(M) + (0.019993 - 0.000101 * T) * Math.sin(2 * M) + 0.000289 * Math.sin(3 * M);
      const om = (125.04 - 1934.136 * T) * R;
      const lam = (L0 + C - 0.00569 - 0.00478 * Math.sin(om)) * R;
      const eps = (23.439291 - 0.0130042 * T + 0.00256 * Math.cos(om)) * R;
      const ra = (Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam)) / R + 360) % 360;
      const dec = Math.asin(Math.sin(eps) * Math.sin(lam)) / R;
      const gmst = (280.46061837 + 360.98564736629 * (jd - 2451545) + 0.000387933 * T * T) % 360;
      const gast = gmst - 0.00478 * Math.sin(om) * Math.cos(eps);
      return { gha: (((gast - ra) % 360) + 360) % 360, dec };
    }

    const toolList = document.getElementById('toolList');
    const formEl = document.getElementById('form');
    const toolTitle = document.getElementById('toolTitle');
    const toolDesc = document.getElementById('toolDesc');
    const toolEyebrow = document.getElementById('toolEyebrow');
    const resultBox = document.getElementById('resultBox');
    const toolSearch = document.getElementById('toolSearch');

    let currentTool = 'besteck';

    function renderToolList(filter = '') {
      const q = filter.trim().toLowerCase();
      const entries = Object.entries(calculators).filter(([key, tool]) => {
        const hay = `${tool.label} ${tool.description} ${tool.group}`.toLowerCase();
        return !q || hay.includes(q);
      });

      toolList.innerHTML = entries.map(([key, tool]) => `
        <button class="tool-item ${key === currentTool ? 'active' : ''}" data-key="${key}" type="button">
          <strong>${tool.label}</strong>
          <small>${tool.description}</small>
        </button>
      `).join('');

      toolList.querySelectorAll('.tool-item').forEach(btn => {
        btn.addEventListener('click', () => {
          currentTool = btn.dataset.key;
          renderCalculator();
        });
      });
    }

    function renderCalculator() {
      const tool = calculators[currentTool];
      toolTitle.textContent = tool.label;
      toolDesc.textContent = tool.description;
      toolEyebrow.textContent = tool.group;

      const inp = (p, f) => `<input type="number" step="any" ${p.min !== undefined ? 'min="' + p.min + '"' : ''} ${p.max !== undefined ? 'max="' + p.max + '"' : ''} placeholder="${p.ph || ''}" inputmode="decimal" value="${p.def ?? ''}" data-def="${p.def ?? ''}" data-field="${p.name}" aria-label="${f.label} ${p.ph || ''}">`;
      formEl.innerHTML = '<div class="calc-form">' + tool.fields.map(field => field.kind === 'multi' ? `
        <div class="field wide">
          <label>${field.label}</label>
          <div class="grp">${field.parts.map(p => inp(p, field)).join('')}${field.sel ? `<select data-field="${field.sel.name}" data-def="${field.sel.opts[0]}" aria-label="${field.label}">${field.sel.opts.map(o => `<option>${o}</option>`).join('')}</select>` : ''}</div>
        </div>` : `
        <div class="field">
          <label>${field.label}</label>
          <input type="${field.type || 'number'}" value="${field.value ?? ''}" data-def="${field.value ?? ''}" data-field="${field.name}" ${field.type === 'time' || field.type === 'date' ? '' : 'step="any"'}>
        </div>
      `).join('') + '</div>' + (tool.example ? '<div class="button-row" style="margin-top:12px"><button type="button" class="secondary" id="exBtn">Beispiel laden</button></div>' : '');
      const ex = document.getElementById('exBtn');
      if (ex) ex.addEventListener('click', () => { Object.entries(tool.example).forEach(([k, val]) => { const el = formEl.querySelector(`[data-field="${k}"]`); if (el) el.value = val; }); calculateCurrent(); });
      lastResult = null;

      renderToolList(toolSearch.value);
      resultBox.textContent = 'Ergebnis erscheint hier.';
    }

    let lastResult = null;
    function readValues() {
      const values = {};
      formEl.querySelectorAll('[data-field]').forEach(el => { values[el.dataset.field] = el.value; });
      return values;
    }
    function fieldText(field, v) {
      if (field.kind === 'multi') {
        const sep = field.parts.length === 3 && field.parts[0].name === 'day' ? '.' : (field.parts.length === 3 && field.parts[0].name === 'uh' ? ':' : ' ');
        const unit = field.parts.length === 3 && !['day', 'uh'].includes(field.parts[0].name) ? ['° ', "' ", '"'] : null;
        let t = field.parts.map((p, i) => (v[p.name] === '' ? '0' : v[p.name]) + (unit ? unit[i] : (i < 2 ? sep : ''))).join('').trim();
        if (field.parts.length === 1) t = v[field.parts[0].name] + '°';
        if (field.sel) t += ' ' + v[field.sel.name];
        return t;
      }
      return v[field.name];
    }
    function calculateCurrent() {
      const tool = calculators[currentTool];
      const values = readValues();
      const result = tool.calc(values);
      if (result.error) {
        resultBox.innerHTML = '<span class="calc-err">' + result.error + '</span>';
        lastResult = null;
        return;
      }
      resultBox.innerHTML = '<div class="result-list">' + result.items.map(item => `
        <div class="row-result"><span>${item.label}</span><b>${item.value}</b></div>
      `).join('') + '</div>' + (result.steps ? '<div class="steps"><h4>Rechenweg</h4>' + result.steps.map(s => `<div class="row-result"><span>${s.label}</span><b>${s.value}</b></div>`).join('') + (result.note ? '<p style="margin:10px 0 0;color:var(--nt-muted)">' + result.note + '</p>' : '') + '</div>' : '');
      lastResult = { tool, values, result };
    }

    function openPrint() {
      if (!lastResult) calculateCurrent();
      if (!lastResult) return;
      const { tool, values, result } = lastResult;
      const rows = a => a.map(i => `<tr><td>${i.label}</td><td>${i.value}</td></tr>`).join('');
      const ins = tool.fields.map(f => ({ label: f.label, value: fieldText(f, values) }));
      const now = new Date();
      document.getElementById('pmSheet').innerHTML = `
        <h1>NavTool · ${tool.label}</h1>
        <div class="meta">navtool.de · Rechenblatt · erstellt am ${now.toLocaleDateString('de-DE')} um ${now.toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'})} Uhr</div>
        <h2>Eingaben</h2><table>${rows(ins)}</table>
        <h2>Ergebnis</h2><table>${rows(result.items)}</table>
        ${result.steps ? '<h2>Rechenweg</h2><table>' + rows(result.steps) + '</table>' : ''}
        ${result.note ? '<p class="meta">' + result.note + '</p>' : ''}
        <div class="disc"><b>Hinweis:</b> Alle Angaben ohne Gewähr. Diese Berechnung ersetzt weder Nautisches Jahrbuch noch eine sorgfältige Navigation nach guter Seemannschaft.</div>`;
      document.getElementById('printModal').classList.add('open');
    }

    document.getElementById('calcBtn').addEventListener('click', calculateCurrent);
    document.getElementById('pdfBtn').addEventListener('click', openPrint);
    document.getElementById('pmClose').addEventListener('click', () => document.getElementById('printModal').classList.remove('open'));
    document.getElementById('pmPrint').addEventListener('click', () => window.print());
    document.getElementById('resetBtn').addEventListener('click', () => {
      formEl.querySelectorAll('[data-field]').forEach(el => { el.value = el.dataset.def ?? ''; });
      resultBox.textContent = 'Ergebnis erscheint hier.';
      lastResult = null;
    });
    toolSearch.addEventListener('input', (e) => renderToolList(e.target.value));

    renderToolList();
    renderCalculator();
  </script>
  <script src="/assets/navtool-global.js"></script>
</body>
</html>
