</style></head><body>
<header class="sail-h"><div class="logo">NAV<b>TOOL</b> <span>Sailing</span></div><div class="hr"><button id="ins" hidden>Installieren</button><a id="acc" href="/konto/?next=/sailingapp/">Anmelden</a><a id="hub" href="/">NavTool</a><div id="on"></div></div></header>
<div id="sp"><svg viewBox="0 0 100 100" class="cr"><circle cx="50" cy="50" r="44" fill="none" stroke="#2ad4c6" stroke-width="3"/><polygon points="50,8 58,50 42,50" fill="#2ad4c6"/><polygon points="50,92 58,50 42,50" fill="#9db7cc"/></svg><div class="lg2">NAV<b>TOOL</b></div></div><main id="v" class="in"></main><nav id="nv"></nav><dialog id="dg"></dialog>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem('sa1'))}catch{}
S=S||{d:{},tr:[],me:'Eigentümer',pins:[],plan:null,anchor:null,sk:'',rec:null};S.audit=S.audit||[];S.tomb=S.tomb||{};
const save=()=>{kick();try{localStorage.setItem('sa1',JSON.stringify(S))}catch{alert('Speicher voll. Bitte Fotos löschen oder Daten exportieren.')}};
const can=()=>S.me!='Betrachter',uid=()=>Math.random().toString(36).slice(2,9),day=()=>new Date().toISOString().slice(0,10),soon=()=>new Date(Date.now()+30*864e5).toISOString().slice(0,10);
const R=Math.PI/180,sm=m=>m/1852,fm=(n,d=1)=>(+n).toLocaleString('de-DE',{maximumFractionDigits:d}),ROLES=['Eigentümer','Kapitän','Crew','Betrachter'];
const hav=(a,b)=>6371008.8*2*Math.asin(Math.sqrt(Math.sin((b[0]-a[0])*R/2)**2+Math.cos(a[0]*R)*Math.cos(b[0]*R)*Math.sin((b[1]-a[1])*R/2)**2));
const dist=(p,a,b)=>{let d=0;for(let i=a;i<b;i++)d+=hav(p[i],p[i+1]);return d};
const tm=ms=>new Date(ms).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'});
function dl(n,t,ty='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()}
function plot(p){if(p.length<2)return'';const la=p.map(x=>x[0]),lo=p.map(x=>x[1]),k=Math.cos(la[0]*R),x0=Math.min(...lo),y1=Math.max(...la),w=Math.max((Math.max(...lo)-x0)*k,1e-5),h=Math.max(y1-Math.min(...la),1e-5),s=280/Math.max(w,h);
const q=p.map(z=>[Math.round(10+(z[1]-x0)*k*s),Math.round(10+(y1-z[0])*s)]),st=Math.ceil(q.length/12);
return`<svg viewBox="0 0 ${Math.round(20+w*s)} ${Math.round(20+h*s)}" class="map"><polyline points="${q.join(' ')}" fill="none" stroke="var(--acc)" stroke-width="3"/>${q.map((z,i)=>i%st==0||i==q.length-1?`<circle cx="${z[0]}" cy="${z[1]}" r="4" fill="var(--tx)"/>`:'').join('')}</svg>`}
const wps=t=>(t||'').split('\n').map(l=>{const p=l.split(',').map(s=>s.trim()),lo=parseFloat(p.pop()),la=parseFloat(p.pop());return isFinite(la)&&isFinite(lo)?[la,lo,p.join(',')]:null}).filter(Boolean);
function cmp(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const a=new Image();a.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,800/Math.max(a.width,a.height));c.width=a.width*s;c.height=a.height*s;c.getContext('2d').drawImage(a,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.65))};a.src=r.result};r.readAsDataURL(f)}

/* ===== Module (Listen) ===== */
const M={
aufgaben:{t:'Aufgaben',f:[['titel','Aufgabe'],['faellig','Fällig','date'],['erledigt','Erledigt','chk']]},
wartung:{t:'Wartungspläne',f:[['titel','Wartung'],['intervall','Intervall (Tage)','number'],['faellig','Nächste Fälligkeit','date'],['schritte','Arbeitsschritte','area'],['doku','Dokument / Link']]},
ausruestung:{t:'Ausrüstung & Ersatzteile',f:[['titel','Gerät'],['hersteller','Hersteller / Modell'],['handbuch','Handbuch (Link oder Notiz)'],['teile','Ersatzteile an Bord (eine pro Zeile)','area']]},
inventar:{t:'Inventar & Stauorte',f:[['titel','Gegenstand'],['menge','Menge','number'],['ort','Stauort'],['foto','Foto','img']]},
checklisten:{t:'Checklisten',ck:['punkte'],f:[['titel','Liste'],['punkte','Punkte (eine pro Zeile)','area']]},
ausgaben:{t:'Ausgaben',f:[['titel','Wofür'],['betrag','Betrag in €','number'],['kat','Kategorie','sel:Liegeplatz,Treibstoff,Wartung,Ausrüstung,Proviant,Sonstiges'],['datum','Datum','date'],['foto','Beleg','img']]},
proviant:{t:'Proviant',f:[['titel','Artikel'],['menge','Menge','number'],['haltbar','Haltbar bis','date']]},
rezepte:{t:'Rezepte',f:[['titel','Rezept'],['zutaten','Zutaten','area'],['schritte','Zubereitung','area']]},
apotheke:{t:'Bordapotheke',f:[['titel','Medikament'],['menge','Menge','number'],['ablauf','Ablaufdatum','date']]},
crew:{t:'Crew & Rollen',f:[['titel','Name'],['rolle','Rolle','sel:Eigentümer,Kapitän,Crew,Betrachter'],['kontakt','Kontakt']]},
logbuch:{t:'Logbuch',f:[['titel','Eintrag'],['datum','Datum','date'],['pos','Position'],['kurs','Kurs / Fahrt'],['notiz','Notiz','area']]},
dokumente:{t:'Dokumente',f:[['titel','Dokument'],['notiz','Notizen','area'],['foto','Foto / Scan','img']]},
routen:{t:'Routen & To-dos',ck:['todos'],f:[['titel','Tour (z. B. Kiel nach Aarhus)'],['von','Von'],['nach','Nach'],['datum','Abfahrt','date'],['kn','Reisegeschwindigkeit (kn)','number'],['wp','Wegpunkte (je Zeile: Name, Breite, Länge – Dezimalgrad mit Punkt)','area'],['todos','To-dos zur Tour (eine pro Zeile)','area']]}};
const PRE={Einwassern:'Seeventile schließen\nMotor und Kühlwasser prüfen\nBatterien anschließen\nRigg und Wanten kontrollieren\nSicherheitsausrüstung an Bord',Auswassern:'Tanks und Leitungen leeren\nUnterwasserschiff reinigen\nOpferanoden prüfen\nSeeventile warten\nBatterien ausbauen',Winterlager:'Motor winterfest machen\nSegel abschlagen und trocknen\nPolster auslagern\nBilge reinigen\nPersenning prüfen',Nachtfahrt:'Positionslichter testen\nRettungswesten und Lifelines\nTaschenlampe und Rotlicht\nWachplan absprechen\nKurs und Gefahren durchgehen'};
const chk=(k,o,f)=>(o[f]||'').split('\n').map((l,i)=>l.trim()?`<div class="ck" onclick="tg('${k}','${o.id}','${f}',${i})">${l.startsWith('✓ ')?'☑ <s>'+E(l.slice(2))+'</s>':'☐ '+E(l)}</div>`:'').join('');
const who=()=>(S.user&&S.user.name)||'Unbekannt',now2=()=>new Date().toLocaleString('de-DE',{hour12:false}),isAdm=()=>!!(S.reise&&S.reise.admin);
function aud(a,k,o){S.audit.push({t:now2(),u:Date.now(),w:who(),a,k,titel:(o&&o.titel)||'',id:o&&o.id})}
function stampN(o,neu){const w=who(),t=now2();if(neu){o.cr=w;o.ct=t}o.mb=w;o.mt=t;o.u=Date.now()}
function tg(k,id,f,i){if(!can())return;const o=S.d[k].find(x=>x.id==id),l=o[f].split('\n');l[i]=l[i].startsWith('✓ ')?l[i].slice(2):'✓ '+l[i];o[f]=l.join('\n');stampN(o);aud('geändert',k,o);save();go(V)}
function flip(k,id,f){const o=S.d[k].find(x=>x.id==id);o[f]=!o[f];stampN(o);aud('geändert',k,o);save()}
function del(k,id){if(confirm('Eintrag löschen?')){const o=S.d[k].find(x=>x.id==id);aud('gelöscht',k,o);S.tomb[id]=Date.now();S.d[k]=S.d[k].filter(x=>x.id!=id);save();go(V)}}
function pre(n){(S.d.checklisten=S.d.checklisten||[]).push({id:uid(),titel:n,punkte:PRE[n]});save();go(V)}
function wdone(id){const o=S.d.wartung.find(x=>x.id==id);stampN(o);aud('Wartung erledigt','wartung',o);o.log=(o.log?o.log+'\n':'')+day();if(o.intervall)o.faellig=new Date(Date.now()+o.intervall*864e5).toISOString().slice(0,10);save();go(V)}
function w2t(id){const o=S.d.wartung.find(x=>x.id==id);(S.d.aufgaben=S.d.aufgaben||[]).push({id:uid(),titel:o.titel,faellig:o.faellig||'',erledigt:false});save();alert('Aufgabe angelegt.')}
function card(k,o){const m=M[k];let h=`<div class="card"><b>${E(o.titel)}</b>`;
for(const [f,l,t] of m.f.slice(1)){const v=o[f];if(v===undefined||v===''||f=='wp')continue;
if(t=='chk')h+=`<label class="ck"><input type="checkbox" ${v?'checked':''} ${can()?'':'disabled'} onchange="flip('${k}','${o.id}','${f}')">${l}</label>`;
else if(t=='img')h+=`<img class="im" src="${v}" alt="">`;
else if(m.ck&&m.ck.includes(f))h+=`<small>${l}</small>`+chk(k,o,f);
else h+=`<div class="${['faellig','haltbar','ablauf'].includes(f)&&v<soon()?'warn':''}"><small>${l}</small>${E(v)}</div>`}
if(o.cr)h+=`<small>${E(o.cr)} · ${E(o.ct)}${o.mb&&o.mt!=o.ct?' · geändert von '+E(o.mb)+' · '+E(o.mt):''}</small>`;

const rh=(a,b)=>{const f1=a[0]*R,f2=b[0]*R;let dl=(b[1]-a[1])*R;if(Math.abs(dl)>Math.PI)dl=dl>0?dl-2*Math.PI:dl+2*Math.PI;const dp=Math.log(Math.tan(Math.PI/4+f2/2)/Math.tan(Math.PI/4+f1/2)),q=Math.abs(dp)>1e-12?(f2-f1)/dp:Math.cos(f1);return{d:Math.hypot(f2-f1,q*dl)*3440.065,c:(Math.atan2(dl,dp)/R+360)%360}};

function legs(p,kn,m){let h='<table class="lg"><tr><th>Etappe</th><th>Kurs rw</th><th>Distanz</th><th>Kursänderung</th></tr>',tot=0,pc=null;

const dm=(v,a,b)=>{const x=Math.abs(v),d=Math.floor(x);return d+'° '+((x-d)*60).toFixed(3)+"' "+(v<0?b:a)};
const fpos=c=>dm(c.lat,'N','S')+', '+dm(c.lon,'E','W');
function gpsUi(){const e=$('#gp');if(!e)return;e.innerHTML=cur?`<div class="eb">COG</div><div class="big">${cur.cog!=null&&!isNaN(cur.cog)?Math.round(cur.cog)+'°':'–'}</div><div class="mono">${fpos(cur)}</div><div class="mono">${cur.lat.toFixed(6)}°, ${cur.lon.toFixed(6)}° · ±${cur.acc!=null?Math.round(cur.acc):'–'} m</div><div class="mono">SOG ${cur.sog!=null?fm(cur.sog):'–'} kn · ${cur.sog!=null?fm(cur.sog*1.852):'–'} km/h</div>`:'<p class="n">Noch keine Position. GPS starten und die Standortfreigabe erlauben.</p>'}
setInterval(()=>{gpsUi();mark()},1000);
const NATO='Alfa Bravo Charlie Delta Echo Foxtrot Golf Hotel India Juliett Kilo Lima Mike November Oscar Papa Quebec Romeo Sierra Tango Uniform Victor Whiskey X-ray Yankee Zulu'.split(' '),EM=['Sinking vessel','Fire on board','Collision','Person overboard','Medical emergency','Engine failure','Aground','Other emergency'];let MT='MAYDAY',MEI=0;
const spell=s=>[...s.toUpperCase()].map(c=>/[A-Z]/.test(c)?NATO[c.charCodeAt(0)-65]:/[0-9]/.test(c)?c:'').filter(Boolean).join(' ');
function script(){const b=S.boat||{},n=b.name||'(boat name)',w=MT=='MAYDAY'?'MAYDAY MAYDAY MAYDAY':'PAN-PAN PAN-PAN PAN-PAN';
return`${w}\nThis is ${n} ${n} ${n}\n(${spell(n)})\nMMSI: ${b.mmsi||'(MMSI)'}\nPosition: ${cur?fpos(cur):'(no GPS fix)'}\nEmergency: ${EM[MEI]}\nPersons on board: ${b.pob||'?'}\n${MT=='MAYDAY'?'Require IMMEDIATE assistance!':'Require assistance.'}\nOver.`}
function notfall(){const b=S.boat=S.boat||{name:'',mmsi:'',pob:''},up=()=>{$('#sc').textContent=script()};window.nfu=up;
return`<div class="eb">NAVTOOL / NOTFALL</div><h1 class="hud">Notruf-Assistent</h1><div class="card"><div class="seg"><button aria-pressed="${MT=='MAYDAY'}" onclick="MT='MAYDAY';go('notfall')">Mayday</button><button aria-pressed="${MT!='MAYDAY'}" onclick="MT='PAN-PAN';go('notfall')">Pan-Pan</button></div>
<label>Art des Notfalls<select onchange="MEI=this.selectedIndex;nfu()">${EM.map((x,i)=>`<option ${i==MEI?'selected':''}>${x}</option>`).join('')}</select></label>
<label>Bootsname<input value="${E(b.name)}" oninput="S.boat.name=this.value;save();nfu()"></label>
<div class="row2"><label>MMSI<input inputmode="numeric" value="${E(b.mmsi)}" oninput="S.boat.mmsi=this.value;save();nfu()"></label><label>Personen an Bord<input inputmode="numeric" value="${E(b.pob)}" oninput="S.boat.pob=this.value;save();nfu()"></label></div></div>
<div class="card mono" id="sc">${E(script())}</div><div class="r"><button class="b" onclick="speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance($('#sc').textContent),{lang:'en-GB',rate:.85}))">Vorlesen</button><button onclick="watch()">GPS-Position holen</button></div>
<p class="n">Notruf auf UKW Kanal 16 (156,800 MHz). Der Assistent ersetzt keine Seenotausbildung und keine amtliche Notrufprozedur.</p>`}
/* ===== Navigation ===== */
const NAVS=[['routen','🧭','Routen'],['logbuch','📖','Logbuch'],['anker','⚓','Anker'],['live','📡','Live'],['notfall','🆘','Notfall'],['boot','⛵','Boot']];let V='';
function go(v){const ch=v!=V;V=v;const a=NAVS.some(x=>x[0]==v)?v:v=='planer'?'routen':'boot';
$('#nv').innerHTML=NAVS.map(([k,i,l])=>`<button class="${a==k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
$('#v').innerHTML=v=='routen'?home():v=='planer'?planer():v=='notfall'?notfall():v=='reisen'?trips():v=='anker'?ank():v=='live'?live():v=='boot'?boot():v=='plan'?plan():v=='daten'?daten():v=='logbuch'?logv():v=='protokoll'?prot():M[v]?mod(v):'';if(ch){scrollTo(0,0);const m=$('#v');m.classList.remove('in');void m.offsetWidth;m.classList.add('in')}if(v=='planer')setTimeout(initMap,0)}
const net=()=>$('#on').innerHTML='<i class="dot'+(navigator.onLine?'':' off')+'"></i>SYSTEM '+(navigator.onLine?'ONLINE':'OFFLINE');addEventListener('online',net);addEventListener('offline',net);net();
if(S.rec||(S.anchor&&S.anchor.on))watch();
/* V12: die SailingApp ist Teil der NavTool-App (Service Worker liegt im Hauptordner); alte eigene Registrierung entfernen */
if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(/\/sailingapp\/$/.test(r.scope))r.unregister()})).catch(()=>{});if(window.caches)caches.keys().then(k=>k.filter(x=>/^(sailing-|tiles)/.test(x)).forEach(x=>caches.delete(x))).catch(()=>{})}
go('routen');addEventListener('hashchange',joinCheck);setTimeout(()=>{if(!joinCheck())setup()},2200);setTimeout(()=>$('#sp').classList.add('x'),1300);setTimeout(()=>$('#sp').remove(),1800);
</script><script src="/assets/navtool-global.js"></script></body></html>
